<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-root" content="../">
<title>Clientas · Augusta Core</title>
<link rel="icon" href="../shell/simbolo-augusta.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell/shell.css">
<style>
  .filtros { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 8px; position: relative; z-index: 1; }
  .filtros .grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filtros .grupo > span { font: 700 10.5px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); margin-right: 4px; }
  .nota { font-size: 12.5px; color: var(--tinta-2); margin: 0 0 16px; position: relative; z-index: 1; }
  .grilla { display: grid; gap: 18px; position: relative; z-index: 1; margin-bottom: 18px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); } .g-2 { grid-template-columns: 1fr 1fr; }
  .kpi .et { font: 600 12.5px var(--f-ui); color: var(--tinta-2); }
  .kpi .valor { font: 500 30px/1.05 var(--f-titulo); margin: 10px 0 6px; color: var(--tinta); }
  .kpi .det { font-size: 13px; color: var(--tinta-2); }
  .kpi.destacado { background: linear-gradient(160deg, var(--lila) 0%, var(--lila-2) 70%); border-color: #DCD0E8; }
  .kpi.destacado .valor { color: var(--violeta); }
  .cab { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .cab h2 { margin: 0; font: 500 19px/1.2 var(--f-titulo); color: var(--violeta); }
  .cab .ayuda { margin: 4px 0 0; max-width: 780px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .seg .s { border: 1px solid var(--linea); border-radius: 12px; padding: 12px 14px; background: var(--papel); }
  .seg .s b { display: block; font: 500 26px/1.1 var(--f-titulo); color: var(--tinta); margin: 6px 0 2px; }
  .seg .s .t { font: 700 12.5px var(--f-ui); display: flex; align-items: center; gap: 6px; }
  .seg .s .t i { width: 9px; height: 9px; border-radius: 50%; }
  .seg .s small { color: var(--tinta-2); font-size: 12.5px; }
  .barras-h .fila { display: grid; grid-template-columns: 190px 1fr auto; gap: 12px; align-items: center; padding: 6px 0; }
  .barras-h .lbl { font: 600 13.5px var(--f-ui); }
  .barras-h .pista { height: 12px; background: var(--linea-2); border-radius: 4px; overflow: hidden; }
  .barras-h .pista i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--lavanda); }
  .barras-h .val { text-align: right; font-size: 13.5px; min-width: 170px; font-variant-numeric: tabular-nums; }
  .barras-h .val .sub { color: var(--tinta-3); font-size: 12px; margin-left: 6px; }
  .buscar { font: 400 14px var(--f-texto); border: 1px solid var(--linea); border-radius: 99px; padding: 7px 14px; min-width: 200px; outline: none; background: var(--papel); }
  .pie-nota { font-size: 12.5px; color: var(--tinta-3); margin-top: 10px; }
  @media (max-width: 1100px) { .g-4, .seg { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px) { .g-4, .g-2, .seg { grid-template-columns: 1fr; } .barras-h .fila { grid-template-columns: 120px 1fr; } .barras-h .val { grid-column: 1 / -1; text-align: left; } }
</style>
</head>
<body data-page="clientas" data-title="Clientas" data-subtitle="Quién compra, cuántas vuelven y dónde están — clientas de la tienda web">
<main id="contenido"><div class="cargando">Buscando a las clientas…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js"></script>
<script src="../shell/shell.js"></script>
<script src="clientas.js"></script>
</body>
</html>
