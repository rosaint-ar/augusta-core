<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-root" content="../">
<title>Horarios del local · Augusta Core</title>
<link rel="icon" href="../shell/simbolo-augusta.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell/shell.css">
<style>
  .filtros { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 16px; position: relative; z-index: 1; }
  .filtros .grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .filtros .grupo > span { font: 700 10.5px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); margin-right: 4px; }
  .grilla { display: grid; gap: 18px; position: relative; z-index: 1; margin-bottom: 18px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); } .g-2 { grid-template-columns: 1fr 1fr; }
  .turno .et { font: 700 13px var(--f-ui); color: var(--ciruela); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .turno .hor { font: 500 12px var(--f-ui); color: var(--tinta-3); }
  .turno .valor { font: 500 30px/1.05 var(--f-titulo); margin: 12px 0 4px; color: var(--tinta); }
  .turno .lin { display: flex; justify-content: space-between; font-size: 13.5px; padding: 3px 0; color: var(--tinta-2); }
  .turno .lin b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
  .turno .lin.res { border-top: 1px solid var(--linea-2); margin-top: 6px; padding-top: 8px; }
  .veredicto { font: 700 11.5px var(--f-ui); border-radius: 99px; padding: 4px 9px; white-space: nowrap; }
  .v-si { color: var(--bien); background: #E3F1EA; } .v-justo { color: #8A6A1F; background: #F6EDD6; } .v-no { color: var(--mal); background: #F7E4E2; }
  .costos { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
  .costos label { display: grid; gap: 4px; font: 600 12px var(--f-ui); color: var(--tinta-2); }
  .costos input { width: 130px; font: 600 14px var(--f-ui); color: var(--tinta); padding: 8px 10px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); }
  .costos input:focus { outline: none; border-color: var(--lavanda); box-shadow: 0 0 0 3px var(--lila); }
  .cab { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .cab h2 { margin: 0; font: 500 19px/1.2 var(--f-titulo); color: var(--violeta); }
  .cab .ayuda { margin: 4px 0 0; }
  .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .calor { border-collapse: separate; border-spacing: 3px; font-size: 12px; width: 100%; }
  .calor th { font: 600 11px var(--f-ui); color: var(--tinta-3); padding: 2px; text-align: center; white-space: nowrap; }
  .calor th.d { text-align: left; font: 700 12.5px var(--f-ui); color: var(--tinta); padding-right: 8px; }
  .calor td { height: 34px; min-width: 34px; border-radius: 6px; text-align: center; font: 600 11px var(--f-ui); cursor: default; }
  .calor td.cero { background: #F6F4F8; }
  .calor .corte { border-left: 2px dashed #D8D2DD; }
  .escala-calor { display: flex; align-items: center; gap: 8px; font: 500 12px var(--f-ui); color: var(--tinta-2); margin-top: 10px; }
  .escala-calor i { width: 160px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #F1ECF6, #B49BC8, #5B3A78); }
  .claves { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
  .claves b { color: var(--ciruela); }
  .especial { font: 700 11px var(--f-ui); color: var(--ciruela); background: var(--lila); border-radius: 99px; padding: 2px 7px; margin-left: 6px; white-space: nowrap; }
  .pie-nota { font-size: 12.5px; color: var(--tinta-3); margin-top: 10px; }
  @media (max-width: 1100px) { .g-4 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px) { .g-4, .g-2 { grid-template-columns: 1fr; } .costos input { width: 110px; } }
</style>
</head>
<body data-page="local" data-title="Horarios del local" data-subtitle="Qué días y franjas venden, mañana contra tarde, y si cada turno paga lo que cuesta abrirlo">
<main id="contenido"><div class="cargando">Contando tickets de la caja…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supabase.js"></script>
<script src="../shell/shell.js"></script>
<script src="local.js"></script>
</body>
</html>
