<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augusta Core · Ingresar</title>
<link rel="icon" href="shell/simbolo-augusta.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell/shell.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--blanco); padding: 16px; }
  .caja { width: 100%; max-width: 380px; text-align: center; }
  .caja img.logo { width: 190px; margin-bottom: 8px; }
  .caja .bajada { font: italic 400 17px/1.3 var(--f-titulo); color: var(--morado); margin: 0 0 26px; }
  form { text-align: left; display: grid; gap: 14px; }
  label { font: 600 13px var(--f-ui); color: var(--tinta-2); display: grid; gap: 6px; }
  input { font: 400 16px var(--f-texto); color: var(--tinta); padding: 12px 14px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); outline: none; }
  input:focus { border-color: var(--lavanda); box-shadow: 0 0 0 3px var(--lila); }
  .boton { justify-content: center; padding: 13px; margin-top: 4px; }
  .error { color: var(--mal); font-size: 14px; min-height: 20px; }
  .sello-fondo { position: fixed; right: -60px; bottom: -40px; width: 420px; opacity: .07; pointer-events: none; }
</style>
</head>
<body>
<div class="caja">
  <img class="logo" src="shell/logo-augusta.svg" alt="Augusta Intimates">
  <p class="bajada">Core · cómo viene el negocio</p>
  <form class="tarjeta" id="form">
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Contraseña<input name="pass" type="password" autocomplete="current-password" required></label>
    <div class="error" id="error"></div>
    <button class="boton" type="submit">Ingresar</button>
  </form>
</div>
<img class="sello-fondo" src="shell/simbolo-augusta.svg" alt="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shared/supabase.js"></script>
<script>
  const form = document.getElementById('form'), err = document.getElementById('error');
  const volver = new URLSearchParams(location.search).get('volver');
  form.onsubmit = async e => {
    e.preventDefault(); err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.pass.value });
    if (error) { err.textContent = 'No pude ingresar: revisá el email y la contraseña.'; return; }
    location.replace(volver && volver.startsWith('/') ? volver : 'metricas/');
  };
  sb.auth.getSession().then(({ data }) => { if (data.session) location.replace(volver && volver.startsWith('/') ? volver : 'metricas/'); });
</script>
</body>
</html>
